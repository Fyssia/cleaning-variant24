{% if form.non_field_errors %}<div class="note error form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="small">(обязательно)</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="hint error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}<span class="hint error client-error" id="{{ field.auto_id }}_client_error"></span></div>{% endfor %}
