{% load static %}<article class="card service-card"><img class="service-image" src="{% static 'images/services/' %}{{ service.slug }}.svg" alt="{{ service.name }}" width="480" height="240" loading="lazy"><span class="badge">{{ service.get_kind_display|capfirst }}</span><h2>{{ service.name }}</h2><p class="price">{{ service.price|floatformat:0 }} ₽ / {{ service.get_unit_display }}</p><p class="small">{{ service.description|truncatechars:120 }}</p><a class="link-btn" href="{% url 'catalog:service' service.slug %}">Подробнее об услуге</a></article>
